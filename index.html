<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">
    <link href="./css/bootstrap.css" rel="stylesheet">
    <link href="./css/main.css" rel="stylesheet">
</head>

<body>
    <div class="contenedor">
        <h1><img id="logo" src="./images/carrito2.jpg" width="75">Carrito de la compra</h1>
        <div style="margin:10px">
            <pre>                                  Producto                   Precio                    Unidades              Importe</pre>
            <select name="factura" id="factura">
                <option>Seleccione una factura...</option>
            </select>
            <select name="producto" id="producto">
                <option>Seleccione un producto...</option>
            </select>
            <input type="text" id="precio" disabled="disabled">
            <input type="text" id="unidades" value="1">
            <input type="text" id="importe" disabled="disabled">
            <button id="btnAnadirCarrito" class="verde" type="button">Añadir a la cesta</button>
        </div>
        <hr>
        <div class="container">
            <div class="row">
                <table class="table" id="tabla" border="1">
                    <thead class="thead-dark">
                        <tr class="thead-dark">
                            <th class="thead-dark" id="izd">Producto</th>
                            <th class="thead-dark">Precio</th>
                            <th class="thead-dark">Unidades</th>
                            <th class="thead-dark">Importe</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                    <tfoot id="tfoot">
                        <tr>
                            <td></td>
                            <td></td>
                            <td>Total</td>
                            <td align="right">0.00</td>
                            <td style="width:15px"></td>
                        </tr>
                    </tfoot>
                </table>
                <div class="form-group">
                    <button id="btnBorrarCesta" type="button" class="btn">Borrar cesta</button>
                    <button id="btnCrearFactura" type="button" class="btn">Crear factura</button>
                    <button id="btnModificarFactura" type="button" class="btn">Modificar factura</button>
                    <button id="btnEliminarFactura" type="button" class="btn">Eliminar factura</button>
                </div>

            </div>
        </div>
        <button id="globos" type="button" class="btn">Globos</button>
    </div>

    <script type="text/javascript" src="balloons.min.js"></script>
    <script type="module" src="renderer.js"></script>
    <script type="text/javascript">
        document.getElementById("globos").addEventListener('click', () => {
            releaseBalloons();
            releaseTextBalloons();
        });

        window.releaseBalloons = function () {
            balloons();
        };

        window.releaseTextBalloons = function () {
            textBalloons([
                {
                    text: "Hola",
                    fontSize: 100,
                    color: "#ff69b4",
                },
                {
                    text: "💻 Chema 👏👏",
                    fontSize: 90,
                    color: "#42d435",
                }, {
                    text: "🎈🎈🎈🎈",
                    fontSize: 100,
                    color: "#42d435",
                }, {
                    text: "🎈 🎈 🎈",
                    fontSize: 100,
                    color: "#42d435",
                }, {
                    text: "🚀",
                    fontSize: 120,
                    color: "#000",
                },
            ]);
        }
    </script>

</body>

</html>
